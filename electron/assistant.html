<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self' http://localhost:5000 https://cdn.jsdelivr.net https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; worker-src blob:; media-src *; connect-src *;" />
<title>JARVIS Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;600&display=swap" rel="stylesheet" />

<style>
* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width:100%; height:100%;
  background:transparent;
  overflow:hidden;
  font-family:'Inter', sans-serif;
  -webkit-app-region: no-drag;
  user-select:none;
}

/* ── Hidden camera ── */
#cam { position:fixed; top:0; left:0; width:1px; height:1px; opacity:0; pointer-events:none; }

/* ═══════════════════════════════════════════
   GREETING BUBBLE
═══════════════════════════════════════════ */
#greeting {
  display:none;
  position:fixed; bottom:8px; right:8px;
  width:322px;
  background:linear-gradient(135deg, rgba(6,12,26,0.97), rgba(0,8,20,0.98));
  border-radius:16px 16px 4px 16px;
  padding:14px 16px 14px 14px;
  backdrop-filter:blur(20px);
  animation: bubbleIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards;
  transform-origin: bottom right;
}
#greeting.ok  { border:1px solid rgba(52,211,153,0.3); box-shadow:0 0 28px rgba(52,211,153,0.15), 0 16px 48px rgba(0,0,0,0.7); }
#greeting.fail{ border:1px solid rgba(248,113,113,0.3); box-shadow:0 0 28px rgba(248,113,113,0.15), 0 16px 48px rgba(0,0,0,0.7); }

.g-header { display:flex; align-items:center; gap:9px; margin-bottom:9px; }
.g-dot { width:7px; height:7px; border-radius:50%; animation:dotPulse 1.6s ease-in-out infinite; flex-shrink:0; }
.ok  .g-dot { background:#34d399; box-shadow:0 0 8px #34d399; }
.fail .g-dot { background:#f87171; box-shadow:0 0 8px #f87171; }
.g-label { font-family:'Share Tech Mono',monospace; font-size:8.5px; letter-spacing:.22em; font-weight:700; }
.ok  .g-label { color:#34d399; }
.fail .g-label { color:#f87171; }
.g-text { font-family:'Share Tech Mono',monospace; font-size:12.5px; color:rgba(255,255,255,.86); line-height:1.55; min-height:18px; }
.g-cursor { display:inline-block; width:1.5px; height:13px; margin-left:2px; vertical-align:middle; animation:blink .65s ease-in-out infinite; }
.ok  .g-cursor { background:#34d399; }
.fail .g-cursor { background:#f87171; }
.g-tail1 { position:absolute; bottom:-8px; right:18px; width:0; height:0; border-left:9px solid transparent; }
.g-tail2 { position:absolute; bottom:-6px; right:19px; width:0; height:0; border-left:8px solid transparent; border-top:8px solid rgba(6,12,26,.97); }
.ok  .g-tail1 { border-top:9px solid rgba(52,211,153,.3); }
.fail .g-tail1 { border-top:9px solid rgba(248,113,113,.3); }

/* ═══════════════════════════════════════════
   MINI PILL (unlocked)
═══════════════════════════════════════════ */
#mini {
  display:none;
  position:fixed; bottom:8px; right:8px;
  width:184px; height:34px;
  background:linear-gradient(135deg,rgba(0,20,40,.93),rgba(0,10,25,.96));
  border:1px solid rgba(0,212,255,.22);
  border-radius:30px;
  padding:0 14px;
  align-items:center; gap:9px;
  cursor:pointer;
  box-shadow:0 4px 20px rgba(0,0,0,.4);
  transition:border-color .3s, box-shadow .3s;
  -webkit-app-region: no-drag;
  transform-origin: bottom right;
}
#mini:hover { border-color:rgba(0,212,255,.45); box-shadow:0 0 18px rgba(0,212,255,.2),0 4px 20px rgba(0,0,0,.5); }
.mini-dot { width:8px; height:8px; border-radius:50%; background:#00d4ff; box-shadow:0 0 6px #00d4ff; animation:dotPulse 2s ease-in-out infinite; flex-shrink:0; -webkit-app-region:no-drag; }
/* Auth/health status colours for the mini dot:
   green  = authenticated AND server reachable (JARVIS working)
   red    = not authenticated OR server unreachable (not working) */
.mini-dot.authed       { background:#34d399; box-shadow:0 0 8px #34d399; }
.mini-dot.disconnected { background:#f87171; box-shadow:0 0 8px #f87171; animation:none; }
.mini-label { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(0,212,255,.8); letter-spacing:.15em; flex:1; }
.mini-mic { font-size:9px; color:rgba(0,212,255,.4); -webkit-app-region:no-drag; }
/* Listening state on mini pill */
#mini.listening { border-color:rgba(0,212,255,.6); box-shadow:0 0 22px rgba(0,212,255,.3),0 4px 20px rgba(0,0,0,.5); }
#mini.listening .mini-dot { background:#00ffcc; box-shadow:0 0 10px #00ffcc; animation:listenPulse 0.8s ease-in-out infinite; }
#mini.listening .mini-mic { color:rgba(0,212,255,.9); }

/* ═══════════════════════════════════════════
   LOCKED PILL
═══════════════════════════════════════════ */
#locked {
  display:none;
  position:fixed; bottom:8px; right:8px;
  width:152px; height:34px;
  background:linear-gradient(135deg,rgba(30,5,5,.94),rgba(20,0,0,.96));
  border:1px solid rgba(248,113,113,.4);
  border-radius:30px;
  padding:0 14px;
  align-items:center; gap:9px;
  cursor:pointer;
  box-shadow:0 0 14px rgba(248,113,113,.15),0 4px 20px rgba(0,0,0,.5);
  animation:lockedPulse 3s ease-in-out infinite;
  -webkit-app-region: no-drag;
  transform-origin: bottom right;
}
.lock-icon { font-size:10px; color:rgba(248,113,113,.85); -webkit-app-region:no-drag; }
.lock-label { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(248,113,113,.8); letter-spacing:.15em; }
.lock-mic { font-size:9px; color:rgba(248,113,113,.35); -webkit-app-region:no-drag; }

/* Rescanning state on locked */
#locked.scanning {
  border-color:rgba(251,191,36,.45);
  box-shadow:0 0 16px rgba(251,191,36,.2), 0 4px 20px rgba(0,0,0,.5);
  animation:none;
}
#locked.scanning .lock-icon { color:transparent; }
#locked.scanning .lock-label { color:rgba(251,191,36,.8); }
.spinner {
  display:none;
  width:10px; height:10px; border-radius:50%;
  border:1.5px solid rgba(251,191,36,.8);
  border-top-color:transparent;
  animation:spin .9s linear infinite;
  flex-shrink:0;
}
#locked.scanning .spinner { display:block; }
#locked.scanning .lock-icon-wrap { display:none; }

/* ═══════════════════════════════════════════
   CHAT PANEL
═══════════════════════════════════════════ */
#chat {
  display:none;
  position:fixed; bottom:8px; right:8px;
  width:354px; height:462px;
  background:linear-gradient(160deg,rgba(4,10,24,.97),rgba(0,6,18,.98));
  border:1px solid rgba(0,212,255,.18);
  border-radius:16px;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 40px rgba(0,212,255,.1), 0 20px 60px rgba(0,0,0,.7);
  -webkit-app-region: no-drag;
  transform-origin: bottom right;
}

.chat-header {
  display:flex; align-items:center; gap:10px;
  padding:12px 16px;
  border-bottom:1px solid rgba(0,212,255,.1);
  background:rgba(0,212,255,.04);
  flex-shrink:0;
  -webkit-app-region:drag;
}
.chat-dot { width:8px; height:8px; border-radius:50%; background:#00d4ff; box-shadow:0 0 8px #00d4ff; animation:dotPulse 2s ease-in-out infinite; flex-shrink:0; }
.chat-title { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(0,212,255,.8); letter-spacing:.18em; flex:1; }
.chat-close { 
  background:none; border:none; color:rgba(0,212,255,.4); font-size:14px; cursor:pointer; 
  padding:2px 6px; border-radius:4px; transition:color .2s;
  -webkit-app-region:no-drag;
}
.chat-close:hover { color:rgba(0,212,255,.9); }

/* Voice status bar */
.chat-voice-bar {
  display:flex; align-items:center; gap:6px;
  padding:4px 16px;
  background:rgba(0,212,255,.03);
  border-bottom:1px solid rgba(0,212,255,.06);
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.voice-dot {
  width:6px; height:6px; border-radius:50%;
  background:#00d4ff; opacity:.3;
  transition:all .3s;
}
.voice-dot.active { opacity:1; background:#00ffcc; box-shadow:0 0 6px #00ffcc; animation:listenPulse .8s ease-in-out infinite; }
.voice-status-text { font-family:'Share Tech Mono',monospace; font-size:8px; color:rgba(0,212,255,.35); letter-spacing:.08em; flex:1; transition:color .3s; }
.voice-status-text.active { color:rgba(0,255,200,.7); }

.chat-status {
  padding:4px 16px 2px;
  font-family:'Share Tech Mono',monospace; font-size:9px; color:rgba(0,212,255,.4);
  letter-spacing:.1em; min-height:20px; flex-shrink:0;
}

.chat-messages {
  flex:1; overflow-y:auto; padding:10px 14px;
  display:flex; flex-direction:column; gap:8px;
  -webkit-app-region:no-drag;
}
.chat-messages::-webkit-scrollbar { width:3px; }
.chat-messages::-webkit-scrollbar-thumb { background:rgba(0,212,255,.2); border-radius:2px; }

.msg { max-width:86%; display:flex; flex-direction:column; gap:3px; }
.msg.user { align-self:flex-end; }
.msg.jarvis { align-self:flex-start; }
.msg-bubble {
  padding:8px 12px; border-radius:12px;
  font-size:12px; line-height:1.5; word-break:break-word;
}
.msg.user .msg-bubble {
  background:rgba(0,212,255,.15);
  border:1px solid rgba(0,212,255,.2);
  color:rgba(255,255,255,.9);
  border-radius:12px 12px 4px 12px;
}
.msg.jarvis .msg-bubble {
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:rgba(255,255,255,.82);
  border-radius:4px 12px 12px 12px;
}
.msg-label { font-family:'Share Tech Mono',monospace; font-size:8px; color:rgba(255,255,255,.3); letter-spacing:.1em; padding:0 4px; }

/* Voice transcript preview */
.msg.interim .msg-bubble {
  background:rgba(0,212,255,.06);
  border:1px dashed rgba(0,212,255,.15);
  color:rgba(255,255,255,.45);
  font-style:italic;
}

.chat-thinking {
  display:flex; align-items:center; gap:6px;
  padding:10px 14px 4px;
  -webkit-app-region:no-drag;
}
.thinking-dots span {
  display:inline-block; width:5px; height:5px; border-radius:50%;
  background:#00d4ff; margin:0 2px;
  animation:thinkDot .8s ease-in-out infinite;
}
.thinking-dots span:nth-child(2) { animation-delay:.15s; }
.thinking-dots span:nth-child(3) { animation-delay:.3s; }
.thinking-label { font-family:'Share Tech Mono',monospace; font-size:9px; color:rgba(0,212,255,.5); letter-spacing:.08em; }

.chat-form {
  display:flex; align-items:center; gap:8px;
  padding:10px 12px;
  border-top:1px solid rgba(0,212,255,.1);
  flex-shrink:0;
  -webkit-app-region:no-drag;
}
.chat-input {
  flex:1; background:rgba(0,212,255,.06);
  border:1px solid rgba(0,212,255,.15);
  border-radius:20px;
  padding:7px 14px;
  font-family:'Inter',sans-serif; font-size:12px; color:rgba(255,255,255,.88);
  outline:none; transition:border-color .2s;
}
.chat-input:focus { border-color:rgba(0,212,255,.35); }
.chat-input::placeholder { color:rgba(255,255,255,.25); }
.chat-send {
  width:30px; height:30px; border-radius:50%;
  background:rgba(0,212,255,.15); border:1px solid rgba(0,212,255,.25);
  color:rgba(0,212,255,.8); font-size:13px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s;
}
.chat-send:hover { background:rgba(0,212,255,.25); color:#00d4ff; }
.chat-mic {
  width:30px; height:30px; border-radius:50%;
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  color:rgba(255,255,255,.4); font-size:12px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:all .2s;
}
.chat-mic.recording { background:rgba(248,113,113,.15); border-color:rgba(248,113,113,.35); color:#f87171; animation:recPulse 1s ease-in-out infinite; }

/* ═══════════════════════════════════════════
   ANIMATIONS
═══════════════════════════════════════════ */
@keyframes bubbleIn  { from{opacity:0;transform:scale(.15) translateY(8px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes bubbleOut { from{opacity:1;transform:scale(1) translateY(0)} to{opacity:0;transform:scale(.08) translateY(16px)} }
@keyframes shrinkToPill { 
  0%   { opacity:1; transform:scale(1) translateY(0); }
  60%  { opacity:0.8; transform:scale(0.4) translateY(4px); }
  100% { opacity:0; transform:scale(0.05) translateY(14px); }
}
@keyframes pillBounceIn {
  0%   { opacity:0; transform:scale(0.05); }
  60%  { opacity:1; transform:scale(1.12); }
  80%  { transform:scale(0.95); }
  100% { opacity:1; transform:scale(1); }
}
@keyframes dotPulse  { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.3)} }
@keyframes listenPulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.6;transform:scale(1.5)} }
@keyframes blink     { 0%,100%{opacity:1} 50%{opacity:0} }
@keyframes lockedPulse {
  0%,100%{box-shadow:0 0 14px rgba(248,113,113,.15),0 4px 20px rgba(0,0,0,.5)}
  50%{box-shadow:0 0 24px rgba(248,113,113,.35),0 4px 20px rgba(0,0,0,.5)}
}
@keyframes spin      { from{transform:rotate(0)} to{transform:rotate(360deg)} }
@keyframes thinkDot  { 0%,80%,100%{transform:scale(0);opacity:.3} 40%{transform:scale(1);opacity:1} }
@keyframes recPulse  { 0%,100%{box-shadow:0 0 0 0 rgba(248,113,113,.4)} 50%{box-shadow:0 0 0 6px rgba(248,113,113,0)} }
@keyframes chatIn    { from{opacity:0;transform:scale(.6) translateY(12px)} to{opacity:1;transform:scale(1) translateY(0)} }
@keyframes voiceRipple { 0%{opacity:.6;transform:scale(1)} 100%{opacity:0;transform:scale(2.5)} }
</style>
</head>
<body>

<!-- Hidden camera for face scan -->
<video id="cam" muted playsinline></video>

<!-- ── GREETING BUBBLE ── -->
<div id="greeting">
  <div class="g-header">
    <div class="g-dot"></div>
    <span class="g-label" id="g-label">J.A.R.V.I.S</span>
  </div>
  <div class="g-text" id="g-text"></div>
  <div class="g-tail1"></div>
  <div class="g-tail2"></div>
</div>

<!-- ── MINI PILL ── -->
<div id="mini">
  <div class="mini-dot"></div>
  <span class="mini-label">J.A.R.V.I.S</span>
  <span class="mini-mic" id="mini-mic">🎙</span>
</div>

<!-- ── LOCKED PILL ── -->
<div id="locked">
  <div class="spinner"></div>
  <span class="lock-icon-wrap"><span class="lock-icon">🛡</span></span>
  <span class="lock-label" id="lock-label">LOCKED</span>
  <span class="lock-mic" id="lock-mic">🎙</span>
</div>

<!-- ── CHAT PANEL ── -->
<div id="chat">
  <div class="chat-header">
    <div class="chat-dot"></div>
    <span class="chat-title">J.A.R.V.I.S. ASSISTANT</span>
    <button class="chat-close" id="chat-close" title="Minimise">✕</button>
  </div>
  <!-- Voice listening indicator bar -->
  <div class="chat-voice-bar">
    <div class="voice-dot" id="voice-dot"></div>
    <span class="voice-status-text" id="voice-status-text">VOICE STANDBY</span>
  </div>
  <div class="chat-status" id="chat-status">Connecting…</div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="chat-thinking" id="chat-thinking" style="display:none">
    <div class="thinking-dots"><span></span><span></span><span></span></div>
    <span class="thinking-label">PROCESSING…</span>
  </div>
  <form class="chat-form" id="chat-form">
    <input class="chat-input" id="chat-input" type="text" placeholder="Ask JARVIS anything… or speak" autocomplete="off" />
    <button type="button" class="chat-mic" id="chat-mic-btn" title="Voice input">🎙</button>
    <button type="submit" class="chat-send" title="Send">➤</button>
  </form>
</div>

<!-- Socket.io client from CDN -->
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
<!-- face-api.js from CDN -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════════
const SERVER = 'http://localhost:5000';
const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
const SESSION_ID = 'electron-' + Math.random().toString(36).slice(2, 10);

// ═══════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════
let appState    = 'scanning';
let socket      = null;
let isThinking  = false;
let isRecording = false;
let interimDiv  = null;
// True when the main JARVIS website tab is focused — pauses overlay WSR
// to avoid double wake-word response.
let hudActive   = false;
// Auth/health status driving the mini-dot colour (green=working, red=not).
let isAuthenticated = false;
let serverReachable = false;

// ═══════════════════════════════════════════════════════════════════
// ELEMENTS
// ═══════════════════════════════════════════════════════════════════
const $cam        = document.getElementById('cam');
const $greet      = document.getElementById('greeting');
const $mini       = document.getElementById('mini');
const $miniDot    = $mini.querySelector('.mini-dot');
const $locked     = document.getElementById('locked');
const $chat       = document.getElementById('chat');
const $gText      = document.getElementById('g-text');
const $gLabel     = document.getElementById('g-label');
const $miniMic    = document.getElementById('mini-mic');
const $lockMic    = document.getElementById('lock-mic');
const $lockLbl    = document.getElementById('lock-label');
const $msgs       = document.getElementById('chat-messages');
const $status     = document.getElementById('chat-status');
const $thinking   = document.getElementById('chat-thinking');
const $form       = document.getElementById('chat-form');
const $input      = document.getElementById('chat-input');
const $micBtn     = document.getElementById('chat-mic-btn');
const $close      = document.getElementById('chat-close');
const $voiceDot   = document.getElementById('voice-dot');
const $voiceText  = document.getElementById('voice-status-text');

// ═══════════════════════════════════════════════════════════════════
// WINDOW STATE HELPER
// ═══════════════════════════════════════════════════════════════════
function setState(s) {
  appState = s;
  $greet.style.display  = s === 'greeting'   ? 'block' : 'none';
  $mini.style.display   = s === 'mini'       ? 'flex'  : 'none';
  $locked.style.display = (s === 'locked' || s === 'rescanning') ? 'flex' : 'none';
  $chat.style.display   = s === 'chat'       ? 'flex'  : 'none';

  if (s === 'rescanning') {
    $locked.classList.add('scanning');
    $lockLbl.textContent = 'SCANNING';
    $lockMic.style.display = 'none';
  } else if (s === 'locked') {
    $locked.classList.remove('scanning');
    $lockLbl.textContent = 'LOCKED';
    $lockMic.style.display = '';
  }

  if (window.jarvisElectron) {
    const map = { scanning:'scanning', greeting:'greeting', mini:'mini', locked:'locked', rescanning:'locked', chat:'chat' };
    window.jarvisElectron.setState(map[s] || 'mini');
  }

  if (s === 'mini') updateMiniDot();
}

// ═══════════════════════════════════════════════════════════════════
// MINI-DOT STATUS  (green = authenticated & server reachable = working,
//                   red = not authenticated OR server unreachable)
// ═══════════════════════════════════════════════════════════════════
function updateMiniDot() {
  if (!$miniDot) return;
  const working = isAuthenticated && serverReachable;
  $miniDot.classList.toggle('authed', working);
  $miniDot.classList.toggle('disconnected', !working);
}

// Poll the Node server so the dot flips to red if JARVIS stops working,
// and back to green once it's reachable again.
async function pingServerHealth() {
  try {
    const r = await fetchWithTimeout(`${SERVER}/api/health`, {}, 2500);
    serverReachable = r.ok;
  } catch {
    serverReachable = false;
  }
  updateMiniDot();
}
setInterval(pingServerHealth, 8000);

// ═══════════════════════════════════════════════════════════════════
// GREETING BUBBLE — typewriter + BUBBLE SHRINK ANIMATION to pill
// ═══════════════════════════════════════════════════════════════════
function showGreeting(ok, onDone) {
  const text = ok
    ? "Hello, Sir. Systems online. I'm at your service."
    : "Identity unverified. Access to JARVIS is restricted.";

  $greet.className = ok ? 'ok' : 'fail';
  $gLabel.textContent = ok ? 'J.A.R.V.I.S' : 'ACCESS DENIED';
  $gText.innerHTML = '';
  // Reset animation
  $greet.style.animation = '';
  $greet.style.opacity   = '';
  $greet.style.transform = '';
  setState('greeting');

  // Typewriter
  let i = 0;
  const cur = document.createElement('span');
  cur.className = 'g-cursor';
  $gText.appendChild(cur);

  const iv = setInterval(() => {
    if (i < text.length) {
      $greet.insertBefore
        ? $gText.insertBefore(document.createTextNode(text[i]), cur)
        : $gText.appendChild(document.createTextNode(text[i]));
      i++;
    } else {
      clearInterval(iv);
      cur.remove();

      // Wait 1.8s then animate bubble shrinking to bottom-right corner
      setTimeout(() => {
        // ── BUBBLE SHRINK TO PILL ANIMATION ──
        $greet.style.animation = 'shrinkToPill 0.55s cubic-bezier(0.55,0,0.75,0.2) forwards';

        setTimeout(() => {
          $greet.style.display = 'none';
          $greet.style.animation = 'bubbleIn 0.45s cubic-bezier(0.34,1.56,0.64,1) forwards';
          $greet.style.opacity   = '';
          $greet.style.transform = '';

          // ── PILL BOUNCE IN ──
          onDone(); // sets state to mini/locked which shows the pill
          const pill = ok ? $mini : $locked;
          pill.style.animation = 'pillBounceIn 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards';
          setTimeout(() => { pill.style.animation = ''; }, 600);
        }, 560);
      }, 1800);
    }
  }, 38);
}

// ═══════════════════════════════════════════════════════════════════
// SPEECH SYNTHESIS
// ═══════════════════════════════════════════════════════════════════
function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.rate = 0.95; u.pitch = 0.85; u.volume = 1;
  window.speechSynthesis.speak(u);
}

// ═══════════════════════════════════════════════════════════════════
// VOICE ACTIVITY DETECTOR (VAD)
// ─────────────────────────────────────────────────────────────────
// Web Speech API fails in Electron (needs Google's internal API key).
// Instead: AudioContext monitors mic volume → when voice detected,
// MediaRecorder captures it → sends to /api/transcribe (Gemini) →
// check for "hello jarvis" or other commands.
// ═══════════════════════════════════════════════════════════════════

let vadStream    = null;
let vadCtx       = null;
let vadAnalyser  = null;
let vadInterval  = null;
let vadRecorder  = null;
let vadChunks    = [];
let vadVoiceFrames   = 0;
let vadSilenceFrames = 0;
let vadIsRecording   = false;
let vadActive        = false;

const VAD_VOICE_THRESH  = 5;    // RMS threshold — lowered from 10 to catch quiet/normal speech
const VAD_VOICE_FRAMES  = 1;    // 1 frame before recording starts (~100ms) — catches first syllable
const VAD_SILENCE_FRAMES= 6;    // frames of silence before recording stops (~600ms)
const VAD_POLL_MS       = 100;  // poll every 100ms
const VAD_MIN_BYTES     = 200;  // accept shorter clips

let lastWakeTrigger  = 0;       // dedup: ignore duplicate wake triggers within 2s
let faceAuthFailedAt = 0;       // timestamp of last face auth failure — skip re-scan if recent
let vadListenWindow  = false;   // true for 8s after bare wake word — next speech = command
let vadListenTimer   = null;    // timer to clear vadListenWindow

async function startVAD() {
  if (vadActive) return;
  vadActive = true;
  vadVoiceFrames = vadSilenceFrames = 0;

  try {
    vadStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, sampleRate: 16000 },
      video: false,
    });

    vadCtx      = new (window.AudioContext || window.webkitAudioContext)();
    const src   = vadCtx.createMediaStreamSource(vadStream);
    vadAnalyser = vadCtx.createAnalyser();
    vadAnalyser.fftSize = 512;
    src.connect(vadAnalyser);

    const buf = new Uint8Array(vadAnalyser.frequencyBinCount);

    vadInterval = setInterval(() => {
      if (!vadActive) return;
      // Don't process during scanning/greeting/reauth
      if (appState === 'scanning' || appState === 'rescanning' || appState === 'greeting') return;

      vadAnalyser.getByteFrequencyData(buf);
      const rms = Math.sqrt(buf.reduce((s, v) => s + v * v, 0) / buf.length);

      // Animate mic icon with volume level
      const lvl = Math.min(1, rms / 45);
      $miniMic.style.opacity = (0.25 + lvl * 0.75).toString();
      $lockMic.style.opacity = (0.25 + lvl * 0.75).toString();

      if (rms > VAD_VOICE_THRESH) {
        vadVoiceFrames++;
        vadSilenceFrames = 0;

        if (!vadIsRecording && vadVoiceFrames >= VAD_VOICE_FRAMES) {
          // ── Start recording ──────────────────────────────
          vadChunks = [];
          const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
            ? 'audio/webm;codecs=opus' : 'audio/webm';
          vadRecorder = new MediaRecorder(vadStream, { mimeType: mime });
          vadRecorder.ondataavailable = e => { if (e.data.size > 0) vadChunks.push(e.data); };
          vadRecorder.start();
          vadIsRecording = true;
          console.log('[VAD] 🎙 Voice → recording');
        }

      } else {
        vadSilenceFrames++;
        vadVoiceFrames = 0;

        if (vadIsRecording && vadSilenceFrames >= VAD_SILENCE_FRAMES) {
          // ── Stop recording → transcribe ──────────────────
          vadIsRecording = false;
          const recorder = vadRecorder;
          recorder.onstop = async () => {
            const blob = new Blob(vadChunks, { type: recorder.mimeType });
            if (blob.size >= VAD_MIN_BYTES) {
              await handleAudioBlob(blob, recorder.mimeType);
            }
          };
          recorder.stop();
          console.log('[VAD] 🔇 Silence → stopping');
        }
      }
    }, VAD_POLL_MS);

    console.log('[VAD] ✅ Listening…');

  } catch (e) {
    console.error('[VAD] ❌ Failed to start:', e.message);
    vadActive = false;
    // Auto-restart VAD after 3 seconds if not mid-scan/greeting
    if (appState !== 'scanning' && appState !== 'greeting' && appState !== 'rescanning') {
      console.log('[VAD] 🔄 Will retry in 3s...');
      setTimeout(() => startVAD(), 3000);
    }
  }
}

function stopVAD() {
  vadActive = false;
  if (vadInterval) { clearInterval(vadInterval); vadInterval = null; }
  if (vadIsRecording && vadRecorder?.state !== 'inactive') {
    try { vadRecorder.stop(); } catch {}
  }
  vadIsRecording = false;
  vadVoiceFrames = vadSilenceFrames = 0;
  // NOTE: We keep the stream alive so restarting VAD is instant
}

function destroyVAD() {
  stopVAD();
  if (vadStream) { vadStream.getTracks().forEach(t => t.stop()); vadStream = null; }
  if (vadCtx)    { vadCtx.close().catch(() => {}); vadCtx = null; }
}

// ── Convert blob → base64 → POST to /api/transcribe → handle result ──
async function handleAudioBlob(blob, mimeType) {
  try {
    // FileReader: blob → base64
    const base64 = await new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload  = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(blob);
    });

    const res = await fetch(`${SERVER}/api/transcribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ audio: base64, mimeType }),
    });

    if (!res.ok) {
      console.warn('[VAD] Transcribe HTTP error:', res.status);
      return;
    }
    const { transcript = '', error: tErr } = await res.json();
    if (tErr) console.warn('[VAD] Transcribe server error:', tErr);
    if (!transcript) return;

    const now = Date.now();
    const t   = transcript.toLowerCase().trim();
    console.log('[VAD] 📝 Transcript:', t);

    const isWake   = t.includes('jarvis');
    const isUnlock = t.includes('authenticate') || t.includes('unlock') || t.includes('verify');

    // ── Active listen window: fired after bare wake word, awaiting follow-on ─
    if (!isWake && vadListenWindow) {
      clearTimeout(vadListenTimer);
      vadListenWindow = false;
      console.log('[VAD] 🎤 Active listen → command:', t);
      if (t.length > 1) {
        if (appState !== 'chat') openChat();
        setTimeout(() => sendMessage(transcript), appState === 'chat' ? 0 : 700);
      }
      return;
    }

    // ── MINI: wake word → open chat ──────────────────────────────
    if (appState === 'mini' && isWake) {
      if (now - lastWakeTrigger < 2000) { console.log('[VAD] dedup — ignoring duplicate wake'); return; }
      lastWakeTrigger = now;
      const cmd = t.replace(/hello\s+jarvis/gi,'').replace(/hey\s+jarvis/gi,'')
                   .replace(/ok\s+jarvis/gi,'').replace(/\bjarvis\b/gi,'').trim();
      speak('Yes, Sir?');
      openChat();
      if (cmd.length > 1) {
        setTimeout(() => sendMessage(cmd), 800);
      } else {
        // Bare wake word — wait for follow-on utterance (8 seconds)
        vadListenWindow = true;
        clearTimeout(vadListenTimer);
        vadListenTimer = setTimeout(() => { vadListenWindow = false; }, 8000);
      }
      return;
    }

    // ── LOCKED: wake word → skip face re-scan, go straight to voice auth ──
    if (appState === 'locked' && (isWake || isUnlock)) {
      if (now - lastWakeTrigger < 3000) { console.log('[VAD] dedup — ignoring locked trigger'); return; }
      lastWakeTrigger = now;
      startReauth();
      return;
    }

    // ── CHAT: voice command (continuous listening while chat open) ─
    if (appState === 'chat' && !isThinking && t.length > 0) {
      if (interimDiv) { interimDiv.remove(); interimDiv = null; }
      sendMessage(transcript); // send original-case transcript
    }

  } catch (e) {
    console.warn('[VAD] Transcription error:', e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════
// WEB SPEECH API — parallel wake-word listener (works without server)
// Runs alongside VAD as a reliable fallback for "Hello JARVIS"
// ═══════════════════════════════════════════════════════════════════
let wsr = null;  // Web Speech Recognition instance
let wsrActive = false;
let wsrNetworkBackoff = 0; // grows on repeated 'network' errors
let wsrGaveUp = false;     // true once WSR is abandoned (Electron has no Google key)

function startWSR() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) { console.log('[WSR] Not supported in this build.'); return; }
  if (wsrActive) return;
  if (wsrGaveUp) return; // Web Speech unavailable here — VAD handles wake word
  // Web Speech relies on Google's speech server, whose API key ships ONLY in
  // official Chrome. In Electron it ALWAYS fails with 'network', so skip it
  // entirely and let VAD + /api/transcribe handle wake-word detection.
  if (/Electron/i.test(navigator.userAgent)) {
    if (!wsrGaveUp) {
      wsrGaveUp = true;
      console.log('[WSR] Skipped in Electron — VAD/transcribe handles wake word.');
    }
    return;
  }

  try {
    wsr = new SpeechRecognition();
    wsr.continuous    = true;
    wsr.interimResults = false;
    wsr.lang          = 'en-US';
    wsr.maxAlternatives = 3;

    wsr.onresult = (event) => {
      wsrNetworkBackoff = 0; // backend reachable — clear error backoff
      wsrGaveUp = false;
      const result = event.results[event.results.length - 1];
      // Collect all alternatives for best chance of matching wake word
      const transcripts = Array.from({ length: result.length }, (_, i) =>
        result[i].transcript.toLowerCase().trim()
      );
      console.log('[WSR] Heard:', transcripts);

      for (const t of transcripts) {
        const isWake   = t.includes('jarvis') || t.includes('j.a.r.v.i.s');
        const isUnlock = t.includes('authenticate') || t.includes('unlock') || t.includes('verify') || t.includes('open');

        // ── MINI: wake word → open chat ──────────────────────────────
        if (appState === 'mini' && isWake) {
          const now = Date.now();
          if (now - lastWakeTrigger < 2000) return; // dedup
          lastWakeTrigger = now;
          const cmd = t
            .replace(/hello\s+jarvis/gi, '')
            .replace(/hey\s+jarvis/gi, '')
            .replace(/ok\s+jarvis/gi, '')
            .replace(/\bjarvis\b/gi, '')
            .trim();
          speak('Yes, Sir?');
          openChat();
          if (cmd.length > 1) setTimeout(() => sendMessage(cmd), 800);
          return;
        }

        // ── LOCKED: wake word → skip face re-scan, go to voice auth ──
        if (appState === 'locked' && (isWake || isUnlock)) {
          const now = Date.now();
          if (now - lastWakeTrigger < 3000) return; // dedup
          lastWakeTrigger = now;
          startReauth();
          return;
        }

        // ── CHAT: continuous voice commands ──────────────────────────
        if (appState === 'chat' && !isThinking && t.length > 3) {
          if (interimDiv) { interimDiv.remove(); interimDiv = null; }
          const original = result[0].transcript.trim();
          sendMessage(original);
          return;
        }
      }
    };

    wsr.onerror = (e) => {
      console.warn('[WSR] Error:', e.error);
      // Auto-restart unless it's a permanent error
      if (e.error !== 'not-allowed' && e.error !== 'service-not-allowed') {
        wsrActive = false;
        // 'network' in Electron/embedded Chromium means there is NO Google
        // speech key — Web Speech can never work here. After a few failures,
        // abandon WSR entirely and rely on the VAD + /api/transcribe path
        // (which is the real wake-word engine). This stops the 1/sec error loop.
        if (e.error === 'network') {
          wsrNetworkBackoff = Math.min((wsrNetworkBackoff || 0) + 1, 10);
          if (wsrNetworkBackoff >= 3) {
            if (!wsrGaveUp) {
              wsrGaveUp = true;
              console.warn('[WSR] Web Speech unavailable in this build — using VAD/transcribe only.');
            }
            return; // do NOT restart
          }
          setTimeout(() => startWSR(), Math.min(2000 * 2 ** wsrNetworkBackoff, 60000));
        } else {
          setTimeout(() => startWSR(), 2000);
        }
      }
    };

    wsr.onend = () => {
      wsrActive = false;
      // Don't restart if we've abandoned WSR (unsupported backend).
      if (wsrGaveUp) return;
      // Always restart WSR unless mid-scan/greeting
      // Dedup guard prevents double wake-word response even if both WSR + VAD fire
      if (appState !== 'scanning' && appState !== 'greeting' && appState !== 'rescanning') {
        setTimeout(() => startWSR(), 500);
      }
    };

    wsr.start();
    wsrActive = true;
    console.log('[WSR] ✅ Wake-word listener active (Web Speech API)');
  } catch (e) {
    console.warn('[WSR] Failed to start:', e.message);
  }
}

function stopWSR() {
  wsrActive = false;
  try { wsr?.stop(); } catch {}
  wsr = null;
}




// ═══════════════════════════════════════════════════════════════════
// SOCKET.IO — connect to JARVIS server
// ═══════════════════════════════════════════════════════════════════
function connectSocket() {
  if (socket && socket.connected) return;
  if (socket) { socket.disconnect(); socket = null; }

  socket = io(SERVER, { transports: ['websocket'], reconnectionDelay: 2000, reconnectionAttempts: 10 });

  socket.on('connect', () => {
    console.log('[Socket] Connected:', socket.id);
    $status.textContent = 'NEURAL LINK ESTABLISHED · ' + socket.id.slice(0,6).toUpperCase();
  });

  socket.on('disconnect', () => {
    $status.textContent = 'CONNECTION LOST — RECONNECTING…';
  });

  // ── Browser HUD active/inactive broadcast ─────────────────────────────────
  // When the main JARVIS website (localhost:5173) tab is focused, it emits
  // this event so the overlay can pause its own WSR wake-word listener.
  // This prevents double-response (both overlay + website reacting at once).
  socket.on('browser:hud-active', (data) => {
    hudActive = !!(data?.active);
    console.log('[Socket] browser:hud-active =>', hudActive);
    // Note: WSR is no longer paused when browser HUD is active.
    // Dedup guard (lastWakeTrigger) prevents double-response if both fire.
  });

  socket.on('jarvis:thinking', () => {
    isThinking = true;
    $thinking.style.display = 'flex';
    setVoiceStatus(false, 'PROCESSING…');
  });

  socket.on('jarvis:searching', () => {
    $status.textContent = 'SEARCHING WEB…';
  });

  socket.on('jarvis:executing', (d) => {
    $status.textContent = `EXECUTING: ${d.action || '…'}`;
  });

  socket.on('jarvis:response', (d) => {
    isThinking = false;
    $thinking.style.display = 'none';
    $status.textContent = 'STANDBY';
    // Remove any interim bubble
    if (interimDiv) { interimDiv.remove(); interimDiv = null; }
    addMessage('jarvis', d.display || d.speak);
    if (d.speak) speak(d.speak);
    // Re-enable voice after response
    setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND');
  });

  socket.on('jarvis:error', (d) => {
    isThinking = false;
    $thinking.style.display = 'none';
    $status.textContent = 'ERROR';
    addMessage('jarvis', '⚠️ ' + (d.message || 'An error occurred.'));
    setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND');
  });
}

// ═══════════════════════════════════════════════════════════════════
// VOICE STATUS BAR HELPER
// ═══════════════════════════════════════════════════════════════════
function setVoiceStatus(active, label) {
  if (active) {
    $voiceDot.classList.add('active');
    $voiceText.classList.add('active');
  } else {
    $voiceDot.classList.remove('active');
    $voiceText.classList.remove('active');
  }
  $voiceText.textContent = label;
}

// ═══════════════════════════════════════════════════════════════════
// CHAT HELPERS
// ═══════════════════════════════════════════════════════════════════
function addMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = role === 'user' ? 'YOU' : 'J.A.R.V.I.S.';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  bubble.textContent = content;
  div.appendChild(lbl);
  div.appendChild(bubble);
  $msgs.appendChild(div);
  $msgs.scrollTop = $msgs.scrollHeight;
}

function sendMessage(text) {
  if (!text.trim() || isThinking) return;
  if (interimDiv) { interimDiv.remove(); interimDiv = null; }
  addMessage('user', text);
  $input.value = '';
  setVoiceStatus(false, 'PROCESSING…');
  if (socket?.connected) {
    socket.emit('user:command', { message: text, sessionId: SESSION_ID, expertId: 'jarvis' });
  } else {
    // Reconnect then send
    connectSocket();
    socket.once('connect', () => {
      socket.emit('user:command', { message: text, sessionId: SESSION_ID, expertId: 'jarvis' });
    });
  }
}

function openChat() {
  if (appState === 'chat') return;
  connectSocket();
  setState('chat');
  $chat.style.animation = 'chatIn 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards';
  // VAD keeps running in chat state — any detected speech = a command
  setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND');
  $input.focus();
}

function closeChat() {
  setState('mini');
  setVoiceStatus(false, 'VOICE STANDBY');
  if (interimDiv) { interimDiv.remove(); interimDiv = null; }
  if (socket) { socket.disconnect(); socket = null; }
  speak('Goodbye, Sir.');
  // VAD continues listening for wake word
}

// ═══════════════════════════════════════════════════════════════════
// CHAT MIC BUTTON — push-to-talk using MediaRecorder + Gemini
// ═══════════════════════════════════════════════════════════════════
let chatRecorder = null;

async function toggleChatMic() {
  // ── STOP recording ───────────────────────────────────────────────
  if (isRecording) {
    if (chatRecorder?.state !== 'inactive') chatRecorder.stop();
    isRecording = false;
    $micBtn.classList.remove('recording');
    setVoiceStatus(true, 'PROCESSING…');
    return;
  }

  // ── START recording ──────────────────────────────────────────────
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm';
    const chunks = [];
    chatRecorder = new MediaRecorder(stream, { mimeType: mime });
    chatRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    chatRecorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mime });
      if (blob.size < 500) { setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND'); return; }
      // Convert to base64 and transcribe
      const base64 = await new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload  = () => resolve(r.result.split(',')[1]);
        r.onerror = reject;
        r.readAsDataURL(blob);
      });
      try {
        const res  = await fetch(`${SERVER}/api/transcribe`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audio: base64, mimeType: mime }),
        });
        const { transcript = '' } = await res.json();
        if (transcript && transcript.length > 1) {
          $input.value = transcript;
          sendMessage(transcript);
        } else {
          setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND');
        }
      } catch {
        setVoiceStatus(true, 'LISTENING — SPEAK YOUR COMMAND');
      }
    };
    chatRecorder.start();
    isRecording = true;
    $micBtn.classList.add('recording');
    setVoiceStatus(true, 'RECORDING — SPEAK NOW');
  } catch (e) {
    console.error('[ChatMic] Failed:', e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════
// FACE AUTHENTICATION
// ═══════════════════════════════════════════════════════════════════
// NOTE: runFaceAuth() does NOT set any state itself.
// The caller is responsible for setting the appropriate state
// (either 'scanning' in boot(), or 'rescanning' in startReauth())
// BEFORE calling this function. This ensures the UI stays visible.
async function runFaceAuth() {
  let stream = null;
  try {
    const res = await fetchWithTimeout(`${SERVER}/api/auth/face-profile`, {}, 6000).catch(() => null);
    if (!res?.ok) throw new Error('no-profile');
    const profile = await res.json();
    if (!profile.faceEnrolled || !profile.descriptor) throw new Error('no-profile');

    stream = await navigator.mediaDevices.getUserMedia({ video: { width:320, height:240, facingMode:'user' } });
    $cam.srcObject = stream;
    $cam.muted = true;
    await $cam.play().catch(() => {});
    await delay(800);

    // Load face-api models from CDN, but never let a slow/offline CDN hang boot.
    await Promise.race([
      Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL),
      ]),
      new Promise((_, reject) => setTimeout(() => reject(new Error('model-timeout')), 15000)),
    ]);

    const dets = [];
    for (let i = 0; i < 20 && dets.length < 5; i++) {
      await delay(500);
      try {
        const d = await faceapi
          .detectSingleFace($cam, new faceapi.SsdMobilenetv1Options({ minConfidence: 0.38 }))
          .withFaceLandmarks().withFaceDescriptor();
        if (d) dets.push(d);
      } catch {}
    }

    stopStream(stream);
    if (!dets.length) throw new Error('no-face');

    const stored = new Float32Array(profile.descriptor);
    const best = Math.min(...dets.map(d => faceapi.euclideanDistance(d.descriptor, stored)));
    console.log('[Auth] Face distance:', best.toFixed(3), '(threshold: 0.62)');
    if (best >= 0.62) throw new Error('no-match'); // more permissive threshold

    return true;
  } catch (e) {
    console.log('[Auth] failed:', e.message);
    stopStream(stream);
    return false;
  }
}

function stopStream(stream) {
  stream?.getTracks().forEach(t => t.stop());
  $cam.srcObject = null;
}

// Guard: prevents two simultaneous auth attempts (race condition fix)
let isAuthInProgress = false;

async function startReauth() {
  // ── Race condition guard ─────────────────────────────────────────
  if (isAuthInProgress) {
    console.log('[Auth] Already in progress — ignoring duplicate trigger');
    return;
  }
  isAuthInProgress = true;

  // Pause background listeners while auth is running
  stopVAD();
  stopWSR();

  // Show rescanning spinner — keep window visible
  setState('rescanning');
  if (window.jarvisElectron) window.jarvisElectron.setState('locked');

  // ── Step 1: Try face auth ONLY if it hasn't failed recently (last 60s) ──
  // Avoids spinning the camera repeatedly when face auth conditions haven't changed.
  const faceCooledDown = (Date.now() - faceAuthFailedAt) > 60000;
  let faceOk = false;

  if (faceCooledDown) {
    try {
      faceOk = await runFaceAuth();
    } catch (e) {
      console.warn('[Auth] Face auth threw:', e.message);
      faceOk = false;
    }
    if (!faceOk) faceAuthFailedAt = Date.now();
  } else {
    console.log('[Auth] Skipping face scan — failed recently, going straight to voice auth');
  }

  if (faceOk) {
    isAuthInProgress = false;
    isAuthenticated = true;
    showGreeting(true, () => {
      setState('mini');
      startVAD();
      startWSR();
    });
    return;
  }

  // ── Step 2: Face failed/skipped → try VOICE auth ─────────────────
  console.log('[Auth] Trying voice verification...');
  $lockLbl.textContent = 'SPEAK NOW';
  $lockMic.style.display = '';
  $locked.classList.remove('scanning');
  setState('locked');
  speak('Say your passphrase to verify.');

  let voiceOk = false;
  try {
    voiceOk = await runVoiceAuth();
  } catch (e) {
    console.warn('[Auth] Voice auth threw:', e.message);
    voiceOk = false;
  }

  // Restore locked pill styling
  $locked.classList.remove('voice-scanning');
  $lockLbl.textContent = 'LOCKED';
  isAuthInProgress = false;

  if (voiceOk) {
    // Voice matched enrolled profile
    isAuthenticated = true;
    showGreeting(true, () => {
      setState('mini');
      startVAD();
      startWSR();
    });
  } else {
    // ── Step 3: Both failed — FAIL-OPEN so JARVIS is still usable ──
    // This prevents the user being permanently locked out due to
    // camera/lighting/CDN issues unrelated to their identity.
    console.warn('[Auth] Both face and voice auth failed — failing open for usability');
    isAuthenticated = false;
    speak('Verification failed. Proceeding with limited access.');
    showGreeting(true, () => {
      setState('mini');
      startVAD();
      startWSR();
    });
  }
}

// ═══════════════════════════════════════════════════════════════════
// VOICE AUTHENTICATION FALLBACK
// Records 3 seconds of audio via MediaRecorder → POSTs to /api/auth/verify
// ═══════════════════════════════════════════════════════════════════
async function runVoiceAuth() {
  return new Promise((resolve) => {
    const RECORD_MS = 3500; // record for 3.5 seconds

    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
          ? 'audio/webm;codecs=opus' : 'audio/webm';
        const chunks = [];
        const recorder = new MediaRecorder(stream, { mimeType: mime });

        recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

        recorder.onstop = async () => {
          stream.getTracks().forEach(t => t.stop());
          const blob = new Blob(chunks, { type: mime });

          if (blob.size < 500) {
            console.warn('[VoiceAuth] Recording too short — no voice detected');
            return resolve(false);
          }

          // Convert blob to FormData and POST to /api/auth/verify
          try {
            const formData = new FormData();
            formData.append('audio', blob, 'verify.webm');

            const res = await fetch(`${SERVER}/api/auth/verify`, {
              method: 'POST',
              body: formData,
            });

            if (!res.ok) {
              console.warn('[VoiceAuth] Server error:', res.status);
              return resolve(false);
            }

            const data = await res.json();
            console.log('[VoiceAuth] Result:', data);

            if (data.success && data.match) {
              return resolve(true);
            } else if (data.locked) {
              console.warn('[VoiceAuth] Account locked until:', data.lockUntil);
              speak('Too many failed attempts. System locked.');
              return resolve(false);
            } else {
              return resolve(false);
            }
          } catch (err) {
            console.error('[VoiceAuth] Fetch error:', err.message);
            return resolve(false);
          }
        };

        recorder.start();
        console.log('[VoiceAuth] 🎙 Recording for', RECORD_MS, 'ms...');

        // Pulse mic icon while recording
        $lockMic.style.animation = 'recPulse 0.8s ease-in-out infinite';

        setTimeout(() => {
          $lockMic.style.animation = '';
          if (recorder.state !== 'inactive') recorder.stop();
        }, RECORD_MS);
      })
      .catch((err) => {
        console.error('[VoiceAuth] getUserMedia failed:', err.message);
        resolve(false);
      });
  });
}

// ═══════════════════════════════════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════════════════════════════════
$mini.addEventListener('click', () => { if (appState === 'mini') openChat(); });
$locked.addEventListener('click', () => { if (appState === 'locked') startReauth(); });
$close.addEventListener('click', () => closeChat());
$micBtn.addEventListener('click', () => toggleChatMic());
$form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage($input.value); });
$input.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeChat(); });

// Right-click anywhere on the overlay → native menu (Re-authenticate, etc.)
document.addEventListener('contextmenu', (e) => {
  e.preventDefault();
  if (window.jarvisElectron?.showContextMenu) window.jarvisElectron.showContextMenu();
});

// Electron main process commands
if (window.jarvisElectron) {
  window.jarvisElectron.on('cmd:tray-click', () => {
    console.log('[IPC] tray-click, state:', appState);
    if      (appState === 'mini')   openChat();
    else if (appState === 'chat')   closeChat();
    else if (appState === 'locked') startReauth();  // Force-open reauth on shortcut
    // scanning/greeting: ignore (in progress)
  });
  window.jarvisElectron.on('cmd:reauth', () => {
    if (appState !== 'scanning' && appState !== 'rescanning') startReauth();
  });
}


// ═══════════════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════════════
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

// ── fetch() with a hard timeout so boot() can NEVER hang on a slow/starting
//    server. Without this, a cold-boot fetch to a half-started server keeps the
//    overlay stuck in the invisible 1×1 'scanning' state → mini HUD unresponsive
//    and the wake-word listener (VAD) never starts.
async function fetchWithTimeout(url, opts = {}, ms = 6000) {
  const ctrl = new AbortController();
  const id = setTimeout(() => ctrl.abort(), ms);
  try {
    return await fetch(url, { ...opts, signal: ctrl.signal });
  } finally {
    clearTimeout(id);
  }
}

// ── Wait until the Node server (port 5000) is reachable before running auth.
//    On a fresh PC boot, Electron is still spawning the server when the overlay
//    loads. We poll /api/health so the auth profile fetches actually succeed.
//    If the server never comes up, we still proceed (fail-safe) so the mini
//    pill appears and stays responsive — VAD will connect once the server is up.
async function waitForServer(maxMs = 45000) {
  const start = Date.now();
  while (Date.now() - start < maxMs) {
    try {
      const r = await fetchWithTimeout(`${SERVER}/api/health`, {}, 2500);
      if (r.ok) { console.log('[Boot] ✅ Server reachable'); return true; }
    } catch {}
    await delay(1500);
  }
  console.warn('[Boot] ⚠ Server not reachable after wait — proceeding anyway');
  return false;
}

async function boot() {
  console.log('[JARVIS] Booting silent assistant...');
  setState('scanning');
  await delay(300);

  // Cold boot: the Node server may still be starting. Wait for it so the auth
  // profile fetches below actually work (and boot never hangs on a dead socket).
  serverReachable = await waitForServer();

  // Check if a face profile and/or voice profile exists.
  let hasFaceProfile  = false;
  let hasVoiceProfile = false;
  try {
    const profileRes = await fetchWithTimeout(`${SERVER}/api/auth/face-profile`, {}, 6000).catch(() => null);
    if (profileRes?.ok) {
      const profile = await profileRes.json();
      hasFaceProfile = !!(profile.faceEnrolled && profile.descriptor);
    }
  } catch {}
  try {
    const statusRes = await fetchWithTimeout(`${SERVER}/api/auth/status`, {}, 6000).catch(() => null);
    if (statusRes?.ok) {
      const status = await statusRes.json();
      hasVoiceProfile = !!status.isEnrolled;
    }
  } catch {}

  // ── No biometric profiles at all ──
  // First run or dev mode: nothing to authenticate against → skip auth and
  // go straight to mini. This is the ONLY case where we fail-open.
  if (!hasFaceProfile && !hasVoiceProfile) {
    console.log('[Boot] No biometric profiles — skipping auth, going to mini');
    isAuthenticated = true;
    showGreeting(true, () => {
      setState('mini');
      startVAD();
      startWSR();
    });
    return;
  }

  // ── Attempt face auth if a face profile exists ──
  // Camera must be available and the correct person must be in frame.
  if (hasFaceProfile) {
    setState('scanning');
    // Give the camera 1.5s to warm up before scanning
    await delay(1500);
    let faceOk = false;
    try { faceOk = await runFaceAuth(); } catch (e) { console.warn('[Boot] Face threw:', e.message); }
    console.log('[Boot] Face auth:', faceOk);

    if (!faceOk) faceAuthFailedAt = Date.now();

    if (faceOk) {
      // ✅ Correct person recognised → authenticated
      isAuthenticated = true;
      showGreeting(true, () => {
        setState('mini');
        startVAD();
        startWSR();
      });
      return;
    }

    // ❌ Face auth failed (camera off, wrong person, low light, timeout, etc.)
    // Do NOT fail-open. Show the LOCKED pill and require voice authentication.
    console.warn('[Boot] Face auth failed — requiring voice authentication. Showing locked state.');
    isAuthenticated = false;
    setState('locked');
    startVAD();
    startWSR();
    speak('Identity not verified. Voice authentication required.');
    return;
  }

  // No face profile but has a voice profile → go straight to voice auth (locked)
  console.log('[Boot] No face profile but voice profile exists — showing locked state for voice auth.');
  isAuthenticated = false;
  setState('locked');
  startVAD();
  startWSR();
  speak('Voice authentication required.');
}

// ─── Tray: test mic ───────────────────────────────────────────────
if (window.jarvisElectron) {
  window.jarvisElectron.on('cmd:test-mic', async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(t => t.stop());
      speak('Microphone is working, Sir.');
    } catch {
      speak('Microphone access is denied, Sir.');
    }
  });
}

boot().catch(console.error);
</script>
